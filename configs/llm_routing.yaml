# =====================================================================
# LLM ROUTING — model mapping (cheap vs. expensive) + cost control.
# (review.md §3.2 / §4.3: TriAgent layered routing + AgenticAITA trigger)
#
# The project runs on the DeepSeek API (OpenAI-compatible) with the
# `deepseek-v4-pro` model. Every role below defaults to it; the model
# names are DESIGN INTENT — swap in a different DeepSeek model when the
# budget / role warrants it (all LLM calls must stay on DeepSeek).
# =====================================================================

routing:
  api:
    provider: deepseek                 # B1: registry key in llm_client.PROVIDERS
    base_url: ${DEEPSEEK_BASE_URL}      # OpenAI-compatible endpoint
    api_key: ${DEEPSEEK_API_KEY}
    default_model: ${DEEPSEEK_MODEL}    # deepseek-v4-pro
    timeout_seconds: 60
  quick:
    # B2 cheap tier — intermediate reasoning (schema / code generation).
    model: "deepseek-v4-pro"
  deep:
    # B2 expensive tier — synthesis / judgment (critic, diagnosis). Swap this
    # one line for a stronger DeepSeek model when the budget allows it; the
    # router picks it up with no code change.
    model: "deepseek-v4-pro"
  generator:
    model: "deepseek-v4-pro"          # cheap — schema / hypothesis generation
    role: "schema_generation"
    cost_tier: "cheap"
  code:
    model: "deepseek-v4-pro"          # accurate — schema -> formula translation
    role: "code_translation"
    cost_tier: "cheap"
    temperature: 0.0                    # deterministic code generation
  critic:
    model: "deepseek-v4-pro"          # for EvoQuant performance diagnosis
    role: "evoquant_diagnosis"
    cost_tier: "cheap"
  sentiment:
    model: "deepseek-v4-pro"          # sentence-level sentiment (TriAgent tier)
    role: "sentence_sentiment"
    cost_tier: "cheap"
  fallback: "deepseek-v4-pro"

trigger:
  # AgenticAITA Adaptive Z-Score Trigger Engine — only invoke the heavy
  # LLM when a statistical anomaly is detected, otherwise stay cheap.
  adaptive_zscore:
    enabled: true
    window: 20                    # rolling window over recent market metrics
    trigger_z: 2.0                # |z| beyond this triggers LLM inference
    min_invocation_interval: 60   # seconds between LLM calls (audit + cost)

budget:
  monthly_llm_cost_usd: 500       # blueprint verification checklist: <$500/mo
  code_agent_cache: true          # cache generated code to avoid repeat calls
