# =====================================================================
# FACTOR THRESHOLDS — layered IC / RankIC / ICIR gates (review.md §5).
#
# The blueprint's single IC>0.02 cut-off is replaced by a layered
# evaluation ladder:
#   keep      -> stays in the factor pool
#   good      -> eligible for online export (distillation)
#   strong    -> very strong signal (NVIDIA AlphaCrafter reference)
# =====================================================================

ic:
  keep_threshold: 0.02          # 初筛 —— minimum to keep in pool
  good_threshold: 0.04          # 优质 —— eligible for online export
  strong_threshold: 0.05        # 极强 —— very strong signal

rank_ic:
  keep_threshold: 0.035
  good_threshold: 0.05

icir:
  keep_threshold: 0.30
  good_threshold: 0.60
  evoalpha_reference: 0.24      # EvoAlpha 15-iteration ICIR reference point

sharpe:
  good_threshold: 1.5           # Phase-2 roadmap target
  max_drawdown_limit: 0.15      # Phase-2 roadmap target

multiple_hypothesis:
  alpha: 0.05
  bonferroni: true              # FINSABER compliance: correct for 100s of trials
  min_t_stats: 3.0
  min_deflated_sharpe: 0.90     # Deflated Sharpe (Bailey & López de Prado): below
                                # this the factor does NOT beat the max-Sharpe-by-
                                # luck baseline → reject as snooping noise. N is the
                                # effective independent trial count (family-blocked).

debate:
  # 辩论评审 (TradingAgents Bull/Bear 对抗 + AgenticAITA)：候选因子必须经得起
  # 空方质疑，而非只过 risk gate。多空各列证据，judge 取净得分 (margin=bull−bear)。
  # 默认关闭 require_pass（保持既有接受行为）；开启后 margin < min_margin 的因子
  # 判为 reject_debate。
  require_pass: false
  min_margin: 0                  # bull 净胜 >= 此值才判过（0 = 平局也算过）

neighborhood:
  # A3 (EP004): 因子不只看「IC 最高那个」，还要看邻近变体是否也高（高原而非
  # 尖峰），并记录 in/out-sample IC 相关性 r 作为过拟合早期信号。默认关闭
  # argmax 拒绝（保持纯 argmax 的既有行为）；开启后只有当候选邻域呈高原且
  # in/out IC 排名可外推时才接受 argmax 选出的因子。
  reject_argmax: false
  plateau_band: 0.30              # 与最高 IC 相差 < 30% 视为「同高原」
  min_support_fraction: 0.40      # 至少 40% 邻近变体落在高原上
  in_out_ic_min_r: -0.20          # in/out IC 相关性低于此值判为过拟合（排名不可外推）

tail_spread:
  # A4 (EP004): rank-IC is corrupted by mid-book noise; the *traded* top/bottom-
  # decile long-short spread is the true tradeability criterion. A positive IC
  # with a negative annualised tail spread is a non-tradeable level effect.
  reject_level_effect: true
  min_annualized: 0.0

diversity:
  # 2026-08-10 lowered 0.40 -> 0.25 (validation remedy): under template
  # redirection the accepted pool comes from ONE proven alpha family
  # (低波 + 低换手), whose lookback-horizon variants sit at pairwise AST distance
  # 0.25. This is the file that overrides master_config.yaml (later merge wins),
  # so the floor must be edited HERE, not in master_config.
  min_ast_distance: 0.25        # minimum AST tree distance between kept factors
  max_pool_size: 200
  subtree_frequency_penalty: 0.15   # AlphaJungle frequent-subtree avoidance strength

pit:
  validation_timestamp: "2023-12-31"
  forbidden_future_date: "2024-01-01"

online:
  export_ic_threshold: 0.04     # a factor passing this is distilled to online/

notify:
  # C2: structured daily digest + webhook notification. The webhook URL carries
  # a token — keep it in .env and reference it here, never commit the raw URL.
  webhook_url: "${NOTIFY_WEBHOOK_URL}"
  send_on_accept: true           # only push when at least one factor was accepted

paper:
  # 模拟盘长期测试 (simulated paper trading)：把 Phase 10 三层组合接上日度循环，
  # 逐日调仓/成交/盯市并持久化持仓与资金。账本为 SQLite，进程重启后可续跑。
  ledger_db: "outputs/paper_ledger.sqlite"
  initial_cash: 100000.0
  rebalance_days: 1              # 1 = 日度调仓（Phase 10 回测口径）；>1 = 每隔 N 个交易日
  slippage_bps: 2.0
  commission_bps: 5.0
  min_commission: 1.0
  max_position_pct: 0.05
  pit_strict: true               # 成交价/成交日期不得越界（成交侧 PIT 硬守卫）
  output_json: "outputs/paper_run.json"
