# =====================================================================
# MASTER CONFIGURATION — single source of truth for the whole system.
# Editing this file re-tunes every IC gate, lookback and execution limit
# WITHOUT touching any source code.  (Blueprint §3)
# =====================================================================

project:
  name: "LLM_Quant_2026"
  start_date: "2010-01-01"      # full-A backfill starts here (was 2015-01-01)
  end_date: "2025-12-31"        # Prevent using data after 2025 for training

data:
  # Interpolated from .env PIT_DATABASE_URL (postgresql://pit:pit@localhost:5432/pit_data
  # in production; sqlite:///data/pit_data.db for local/offline runs).
  pit_database_url: "${PIT_DATABASE_URL}"
  news_api_key: ${NEWS_API_KEY}
  # Flip to true after a real ingestion is confirmed — gates the B1-B5 checks in `verify`.
  # Set true 2026-08-10 after the full A-share ingest (5,162 symbols, 12.48M bars).
  real_data: true
  # AlphaFeed primary / Baostock fallback (universe + fundamentals), AKShare for news.
  primary: "alphafeed"
  fallback: "baostock"
  rate_limits:                   # tokens/minute per endpoint (AlphaFeed paid → generous)
    alphafeed_daily: 300
    alphafeed_daily_batch: 120
    alphafeed_quote: 300
    alphafeed_adjust: 120
    alphafeed_minute_batch: 60
    alphafeed_depth_batch: 60
    baostock: 120
  alphafeed:
    api_key: "${ALPHAFEED_API_KEY}"   # interpolated from .env
    batch_size: 100              # symbols per klines.batch call (paid quota: safe)
  baostock:
    enabled: "${BAOSTOCK_ENABLED}"
  akshare:
    enabled: "${AKSHARE_ENABLED}"
  fundamentals:
    pilot_size: 50               # Q4: --fundamentals 只试点前 50 只
  checks:                        # B1-B5 thresholds
    # must be a trading day — a holiday anchor means no baostock snapshot and a
    # false "0 delisted" report (2015-01-01 is the New Year holiday; 01-05 is the first session)
    survivorship_date: "2015-01-05"
    max_staleness_days: 7
    min_coverage: 0.70           # A-share ~242/261 trading bdays ≈ 0.93, so 0.70 is generous
    adjustment_sample: 20        # price symbols sampled by the B3 check
    price_limit_band: 0.30       # max allowed |adjusted daily return| (BJ board ±30%)
  news:
    watchlist: ["600519.SH", "000001.SZ", "600036.SH", "601318.SH", "000858.SZ"]  # smoke-test set
  universe_dir: "data/universe"  # cached constituent lists (hs300/zz500/sse50) written by ingest

llm_routing:
  generator_model: "deepseek-v4-pro"   # Schema generation (single DeepSeek model)
  code_model: "deepseek-v4-pro"        # Code translation
  critic_model: "deepseek-v4-pro"      # EvoQuant diagnosis
  max_tokens: 4096

factor_mining:
  ic_threshold: 0.02                 # Minimum to keep
  rank_ic_threshold: 0.035
  # LIMIT_DOWN blueprint 方案 D: medium/low-frequency only. A 5/10-day reversal's
  # lookback is what produced the crash-continuation bleed in Phase 8.1.
  min_lookback: 60                   # days
  max_lookback: 240
  default_lookback: 120
  allowed_lookbacks: [60, 120, 240]
  auto_upgrade_lookback: true        # bump any <60 lookback the LLM slips in
  # LIMIT_DOWN blueprint 方案 C: replay last-round rejection reasons into the
  # mining LLM so it stops proposing the factor family just proven unprofitable.
  enable_mining_feedback: true
  feedback_rounds: 3
  # validation_BLUEPRINT §3.1/§3.2: code-layer physical block (deepseek-v4-flash
  # ignores prompt feedback and re-proposes the banned reversal family, so the
  # code layer force-replaces it with a combination template) + per-iteration
  # sampling slots (free LLM slots + deterministic dual-factor combination
  # templates). 2+2 per iteration x 5 iterations = 20 factors, matching the
  # 6/20 (>=30%) validation gate.
  enable_code_layer_blocking: true
  free_generation_slots: 2
  template_slots: 2
  # direction 1 (2026-08-26): force the FREE slots into the combination-template
  # space instead of trusting the LLM to invent a single factor. The live
  # verification (2026-08-25) showed deepseek-v4-flash cannot produce a single
  # factor passing the 15% drawdown gate — 0/118 free candidates accepted, 100%
  # reject_high_risk — while the deterministic dual-factor combination templates
  # pass by construction. Forcing free slots onto the template space means the
  # pool grows only from the low-vol / low-turnover family that demonstrably
  # survives the risk gate (and mining becomes fully deterministic — zero LLM
  # tokens on the free path). Set false to re-enable LLM single-factor free
  # slots (now on deepseek-v4-pro).
  force_combination_templates: true

# NOTE: `diversity.min_ast_distance` lives in factor_thresholds.yaml — the
# merge order (master -> thresholds -> llm_routing) means the later file wins,
# so editing it here is silently overridden. Set the diversity floor there.

risk_management:
  max_sharpe_drawdown: 0.15
  # 2026-08 REVERTED to the absolute drawdown gate. validation_BLUEPRINT §3.3's
  # excess-drawdown metric — max_drawdown_of(cum_strat/cum_bench - 1) — was
  # proven mathematically broken for a market-neutral long-short book (beta≈0):
  # it measures the absolute-height drop of the ratio level, so when the strategy
  # compounds ahead of a volatile index, even a PURE CASH position scores
  # excess_dd ≈ 1.03 (vs the 0.25 limit) because the benchmark's own swings
  # (HS300 2013 trough -41%, 2015 peak +51%) dominate. 0/20 rejected under it,
  # yet the same factors pass the absolute 15% gate with abs_dd 0.105-0.109.
  # `benchmark` and `max_excess_drawdown` are removed so the eval gate and risk
  # gate fall back to sharpe.max_drawdown_limit / max_drawdown_in_crisis.
  market_state_bins: ["bull", "bear", "sideways"]
  # LIMIT_DOWN blueprint: a factor must not be a crash artefact — its portfolio
  # drawdown inside each crisis window (on the limit-lock-tradeable series) must
  # stay under max_drawdown_in_crisis (main gate stays 0.15).
  crisis_test:
    enabled: true
    periods:
      - name: "2015股灾"
        start: "2015-05-01"
        end: "2015-09-30"
      - name: "2018熊市"
        start: "2018-01-01"
        end: "2018-12-31"
      - name: "2024微盘股"
        start: "2024-01-01"
        end: "2024-02-29"
    max_drawdown_in_crisis: 0.20

# LIMIT_DOWN blueprint 方案 B: the backtest's portfolio Sharpe / max-drawdown
# run on forward returns with price-limit-locked bars masked (a -10% continuation
# you cannot actually transact), while IC/rank_ic stay on the raw series.
evaluation:
  ic_use_raw_returns: true
  portfolio:
    exclude_limit_locked: true
    limit_threshold: 0.095           # 主板 10% limit band
    dynamic_threshold: true          # 创业/科创 20% (2020-08-24+), 北交所 30%

online_execution:
  latency_target_ms: 10              # Must execute fast
  max_position_pct: 0.05

# Phase 9.2 — PEAD (post-earnings announcement drift). Signal = seasonal SUE
# (cumulative EPS vs same quarter one year earlier, PIT via Baostock pubDate).
# The profit panel is fetched once and cached under data/financials/.
pead:
  enabled: true
  signal_expiry_days: 60             # PHASE9 §4.2: signal decays after 60 days
  min_eps_history: 8                 # at least 8 quarterly reports before use
  ic_gate: 0.015                     # §8.1: single-factor IC > 0.015
  cache_dir: "data/financials"

# Phase 9.1 — Chinese news-sentiment TriAgent. User decision (2026-08-11):
# news is real-time-forward only (free feeds have no history); the IC>0.015 gate
# runs on research-report title sentiment (the backfillable channel). Gate
# threshold per user: 0.015 (from PHASE9, not the 0.01 in PHASE9_1).
sentiment:
  enabled: true
  data_dir: "data/news"              # live news, forward-accumulated
  report_dir: "data/reports"         # research-report history (backtest source)
  score_cache: "data/reports/report_sentiment.parquet"
  bert_model: "data/models/finbert_zh"   # FinBERT_zh (blueprint §3.3) primary
  lexicon_threshold: 0.3             # |lexicon| >= this -> word tier decides
  bert_threshold: 0.25               # cross-article std > this -> critic tier
  critic_min_articles: 3             # critic needs >= this many articles
  decay_days: 10                     # report-signal carry-forward window
  ic_gate: 0.015                     # §8.1: max(ic, rank_ic) > 0.015

# Walk-forward research windows (requirements.md C1-C2). The research loops
# (mine/backtest/monitor) run on `research.universe`; the underlying data stays full-A.
research:
  train_start: "2010-01-01"
  train_end: "2019-12-31"
  val_start: "2020-01-01"
  val_end: "2021-12-31"
  test_start: "2022-01-01"
  test_end: "2025-12-31"
  universe: "hs300_500"          # "all" | a symbol list | a cached name under data.universe_dir
  mining:
    iterations: 50               # C1: increased from default 3
    walks: 20                    # C1: more walk-forward rounds
    bonferroni_correction: true  # C1: multiple testing correction
  decay:
    window_days: 90
    icir_threshold: 0.30         # aligns with factor_thresholds.yaml icir.keep_threshold

# =====================================================================
# PHASE 10 — 三层组合模拟盘 (PHASE10_BLUEPRINT §3.5)
# Alpha 核心 (Phase 8) → 战术倾斜 (Phase 9.2 PEAD) → 风控熔断 (Phase 9.1 舆情)
# =====================================================================
simulation:
  enabled: true
  start_date: "2010-01-01"
  end_date: "2025-12-31"
  rebalance_frequency: "monthly"     # alpha 因子为 120/240 日慢变量，日度近似月频
  universe: "hs300"

alpha_core:
  factors:
    - name: "low_vol_low_turnover"
      count: 5
      weights: "equal"
      rebalance: "monthly"
  long_pct: 0.10                     # top-decile 多头持仓
  short_pct: 0.10                    # bottom-decile 空头持仓（市场中性）
  max_position_pct: 0.05             # 单票上限（与 online_execution 一致）
  neutralize: true                   # 动量截面中性化（MLMultiFactorBiasCorrection 处方）
  beta_neutralize: true              # 叠加市场 beta 中性化（低波动因子结构性短 beta → 净 beta 泄漏）
  beta_lookback: 252                 # beta 估计窗口（滚动协方差/方差）
  momentum_lookbacks: [20, 60, 120, 252]
  regime_short: true                 # AlphaCrafter γ: 强上涨趋势中收缩空腿
  trend_days: 60                     # 等权市场趋势窗口
  trend_gate: 0.03                   # 60日趋势 > 3% 触发
  short_scale: 0.5                   # 触发时空腿缩至 0.5 再 gross 归一

seasonal_tilt:
  enabled: true
  type: "pead_reversal"
  amplitude: 0.4                    # 倾斜幅度（§7 回校自动写回，注释不随值变动）
  min_weight: 0.015                  # 权重 > 1.5% 才调整（市场中性粗仓约 1.7%）
  window_days: 5
  months: [1, 2, 4, 8, 10]           # 年报/一季报/中报/三季报窗口

risk_overlay:
  enabled: true
  type: "sentiment_risk"
  zscore_threshold: -1             # 历史 5% 分位
  position_cut: 0.50                 # 触发即减半仓
  freeze_days: 11                     # 触发后保持的交易日数（§7 回校自动写回）
  min_trigger_samples: 20            # 低于该样本数不触发（防退化 std）

# =====================================================================
# 模拟盘 (PaperRunner) — 账本 + 交易成本参数（§7 成本模型回校目标）
# =====================================================================
paper:
  ledger_db: "outputs/paper_ledger.sqlite"
  output_json: "outputs/paper_run.json"
  initial_cash: 100000.0
  warmup_calendar_days: 540          # 影子/paper 预热（≈360 交易日）——必须 > 最长因子窗口 252 日，否则期初簿形落在 LightGBM 缺失值分支
  slippage_bps: 2.0                  # 冲击成本（买贵卖贱，双边）
  commission_bps: 2.5                # 券商佣金（当前固定粗估；§7 会写回真实 ~2.5）
  min_commission: 5                # 最低佣金（真实 A 股为 5 元）
  stamp_tax_sell_bps: 5            # 印花税 0.05% 仅卖出（真实 5.0，§7 写回）
  transfer_fee_bps: 0.1              # 过户费 0.001% 双边（真实 0.1，§7 写回）
  max_position_pct: 0.05             # 单票上限
  rebalance_days: 20                 # 对齐 alpha 月频信号（约 20 交易日/月），砍掉日度重估导致的换手
  pit_strict: true

# =====================================================================
# 影子模式 (shadow) — 不实盘下单，逐日记录目标持仓 + PnL（PAICC 每日调度）
# =====================================================================
shadow:
  enabled: true
  start_date: "2026-01-01"           # 影子观察期起点（超出回测 test_end 2025-12-31）
  universe: "hs300"                  # 默认影子 universe；账户级 universe 键可覆盖（hs300_500 = HS300+ZZ500）
  ledger_db: "outputs/shadow_ledger.sqlite"
  refresh_data: true                 # 运行前增量 ingest 行情
  refresh_pead: true                 # 增量 Baostock 利润表（当前年）
  refresh_sentiment: true            # 增量 AKShare 研报（重取全部，较重）
  status_json: "outputs/shadow_status.json"
  report_md: "outputs/shadow_report.md"
  refresh_benchmark: true             # 运行前抓取 HS300 指数基准（失败保留旧缓存）
  benchmark_cache: "data/benchmark/hs300_index.csv"
  # 单资金轨（2026-09-08 起）：仅保留 D 轨（回撤买入 + 实时日内止损）。
  # A_200W / B_10W / C_5W 三条 ML 截面轨已退役 —— 账本/状态/报告归档至
  # outputs/archive/2026-09-08_retire_ABC/，本配置不再注册（不再计入日度闭环、
  # 红线、邮件与 PAICC 面板）。D 轨仍是长期影子观察，未接入真实资金。
  # 每个账户独立账本/状态/日报，文件按 name 后缀。
  # priority 决定日度闭环运行顺序（当前仅 D 轨，100）。
  accounts:
    - name: "D_5W"
      priority: 100                     # 实时拟真轨最高优先级，日度闭环最先处理
      cash: 50000
      # 部署口径 = 日内止损 + 确认式触发(close) + 开盘30分钟豁免 + 尾盘量比门槛 + 满仓化
      #            + 固定 3.5% 止损（stop_lo == stop_hi == 0.035，见 pb_stop_hi 处 D-8c 说明）。
      # 部署口径实测出处（生产同构装配、fresh ledger、2026-01-01→08-28，**修正后的 800 只池**）：
      #   outputs/d_oos_is_2026_v5.json 与 outputs/d_stop_grid_is_2026_800.json 的 flat_3p5
      #   → +5.72% 累计 / +9.28% 年化 / Sharpe 0.67 / maxDD 8.42% / 236 笔。
      # ⚠ 2026-09-10 更正：此前本处引用的 +16.36%/Sharpe 1.66 是在**只有 301 只标的**的
      #   截面上得到的（当时日度入库只覆盖约 300 只），已作废；补齐 800 只后 IS 数字下降
      #   约三分之二 → 见 docs/D_TRACK_EVIDENCE.md §六。
      # 注意：outputs/d_oos_*.json 中的旧标签（is_2026 / oos_2025h2 / *_v2 / *_v3 / *_v4 早期版本）
      #   是旧口径或含数据洞/缺陷截面，不得引用；可引用的当前工件是
      #   d_oos_is_2026_v5.json 与 d_oos_oos_2025h2_v5.json（14 项断言全通过、含 provenance 五项）。
      # 触发约定的敏感性研究（ATR 自适应止损口径）：outputs/d_track_grid7.json。
      alpha_source: "pullback"        # Martin Luk 回撤买入纪律（日线版，ML 扫描 + 改良）
      universe: "hs300_500"           # 扫描截面（与已退役 B/C 轨一致，便于对比）
      rebalance_days: 1               # 逐日评估止损/追踪/入场
      max_position_pct: 0.40          # 单槽上限 0.40（outputs/d_track_grid5.json + grid6.json：0.50+ 集中度损害）
      notional_floor: 2000            # 每股 ~8333 元（50k/6 槽）
      band_frac: 0.0
      pb_rank_source: "ml"            # 强势股扫描器 = ML 工件截面排名（2026 A 股原始动量回撤失效，ML 扫描为改良版）
      pb_rank_min: 0.8                # 排名前 20% 才有入场资格
      pb_k: 6                         # 6 个等权槽位（2026 段出处 outputs/d_track_grid3.json D_t21_k6：+6.4% 年化 / Sharpe 1.34 / maxDD 2.2%）
      pb_ema_fast: 21                 # 慢追踪 EMA(21)（网格最优：让利润跑得更远）
      pb_ema_zone: 21                 # 回调区间 EMA(21)
      pb_zone_band: 0.02              # |收盘/EMA21 - 1| ≤ 2%
      pb_pullback_min: 0.03           # 距 10 日高点至少回落 3%（真实回调）
      pb_vol_shrink: true             # 缩量回调确认（5 日均量 < 20 日均量）
      pb_atr_mult: 1.5                # ATR 自适应系数（当前停用：stop_lo == stop_hi 使 ATR 通道失效）
      pb_stop_lo: 0.035               # 固定止损 3.5%（D-8c 止损宽度再调优的结论，见下）
      pb_stop_hi: 0.035               # 2026-09-10 在**修正后的 800 只池**上重跑 8 个宽度变体
                                      # （scripts/d_stop_grid.py --label is_2026_800 / oos_2025h2_800）：
                                      #   变体            IS2026 Sharpe   OOS2025H2 Sharpe   max-min
                                      #   flat_3p5（现役）    0.67            0.40           0.40  ← 冠军
                                      #   atr_1p0_25_35       0.98            0.29           0.29
                                      #   atr_1p0_25_40      −0.12            0.65          −0.12
                                      #   atr_1p5_25_40      −0.13            1.10          −0.13
                                      # 选择规则不变（跨两窗口 max-min）→ flat_3p5 仍胜出；
                                      # 两窗口排序互相冲突（Spearman ≈ −0.19），差异均在噪声内
                                      # （159/82 日、|t|<1），故只把它当"值得跟踪"而非"可切换"。
                                      # 2026-09-09 的旧版说明（+16.36%/1.66 等）随 301 只截面一并作废，
                                      # 历史见 docs/D_TRACK_EVIDENCE.md §三。
      pb_breakeven_r: 1.0             # +1R 后止损上移至成本
      pb_trail_r: 1.5                 # +1.5R 后启用追踪
      pb_exit_into_strength_r: 3.0    # +3R 且乖离 EMA21>8% 冲高离场（锁定 parabolic 利润）
      pb_max_hold: 40                 # 最长持有 40 交易日（动量衰减回收）
      pb_entry_gate: 0.0              # 市场环境过滤器：60 日均权趋势 > 0 才开新仓
      pb_exit_gate: -0.03             # 市场趋势 < -3% 全簿清仓（"停止交易"规则化）
      pb_use_intraday: true           # AlphaFeed 分钟K日内特征包（data/intraday/daily_features.parquet）
      pb_intraday_stops: true         # 日内止损执行：分钟K逐 bar 检测破位（<15:00），当场卖出并记录成交时刻
      pb_stop_trigger: "close"        # 确认式触发（分钟收盘破位而非插针最低价）。
                                      # 触发约定敏感性（ATR 自适应口径，2026-09-09 重跑 outputs/d_track_grid7.json）：
                                      # D_close_only 12.54% / D_low 12.93% / D_close_trig 13.96% / D_close_skip30 8.26%（年化）
                                      # —— 修复 TR 口径后"日内止损必损"的旧结论不再成立，故保留日内止损。
      pb_stop_open_minutes: 30        # 开盘 30 分钟豁免（集合竞价/开盘异动不扫损）。
                                      # 部署口径实测（旧 2.5% 宽度下的 outputs/d_atr_impact.json）：
                                      # 带豁免 +24.82%/Sharpe 1.53 vs 不带 +21.92%/1.35 → 保留；
                                      # 3.5% 宽度下尚未单独 A/B（列为待办）。
      pb_stop_buffer: 0.0             # 触发缓冲（v7 网格 0.5% 缓冲略逊，关闭）
      pb_live_intraday_from: "2026-09-04"  # 该日起日内止损由实时交易服务执行；收盘回放不再对当日历史时点补做交易
      pb_tail_vol_max: 0.5            # 尾盘 30 分钟量比 ≤ 0.5 才入场（outputs/d_track_intraday.json：D_tail50 年化 21.2% vs D_base 20.8%）
      pb_vwap_filter: 0.0             # 真实VWAP回调过滤（网格验证为负增益，关闭）
      pb_stop_rv: false               # RV 止损（网格验证为负增益，关闭）
      pb_open30_max: 0.0              # 开盘30分钟过滤（网格验证无增益，关闭）
      pb_range_max: 0.0               # 日内振幅过滤（网格验证为负增益，关闭）
      pb_full_invest: true            # 满仓化：每个持仓 1/n 权重（outputs/d_track_grid4.json：D_base 21.2% → D_full_cap25 26.5% 年化）

# =====================================================================
# 部署通道 (deployment) — 只约束「从现在起」的行为，绝不回溯改写历史成交。
# observe = 影子/模拟盘：全部成交由本系统的纸面撮合产生，不向任何券商发单；
# real_money_enabled 是硬闸门：未来接入券商适配器时，必须先调用
# src/deploy.assert_simulated_only()，闸门关闭时直接抛错而不是下单。
# 接入前置条件见 docs/LIVE_READINESS.md（未全绿不得接实盘）。
# =====================================================================
deployment:
  mode: "observe"                    # observe | live
  real_money_enabled: false          # 硬闸门：false = 只允许模拟成交
  observe_since: "2026-01-01"
  note: "影子/模拟盘：未接入任何券商接口，不产生真实委托"
  # 前向期政策（预注册口径、风险闸门阈值、候选切换规则、偏差压力测试闸门）
  # 唯一权威来源是 configs/forward_policy.yaml（随默认 load_config 一并加载）；
  # 说明与运行手册见 docs/FORWARD_PROTOCOL.md。
  forward_policy: "configs/forward_policy.yaml"

# 实时盘中交易（D 轨日内止损的实盘式执行，09:30–15:00 逐分钟轮询最新成交价；
# 15:00 后的收盘集合竞价由 preclose 委托层负责，避免同一标的双重成交）
live:
  enabled: true
  account: "D_5W"                    # 实时执行账户（须为 pullback 账户）
  poll_seconds: 60                   # 轮询间隔（秒）
  max_quote_age_minutes: 5           # 报价陈旧阈值：超过则本轮不做决策（停牌/数据延迟），并写入状态文件

# D 轨模型长期自优化闭环（月度滚动重训 + 平行挑战者 + 前向晋升闸门）
# —— 替代原周六 §7 校准与周日周度任务；详见 docs/D_MODEL_CYCLE.md
d_model_cycle:
  enabled: true
  challenger_ledger: "outputs/shadow_ledger_D_5W_CH.sqlite"  # 挑战者独立账本
  margin_pp: 0.3                     # 晋升边际：挑战者需超现役 +0.3pp/月
  min_fills: 5                       # 晋升前提：评估窗至少 5 笔挑战者成交
  window_days: 30                    # 前向评估窗（自然日）
  auto_promote: false                # 人工确认：30 日窗 + 5 笔样本无法区分真实优势（Sharpe SE≈√(252/N)），
                                     # 默认只报告「达到晋升条件」并保留挑战者工件，不自动替换生产模型

# =====================================================================
# 红线监控阈值 (red_lines) — 影子盘逐日输出的四条红线 + PAICC 量化面板展示。
# 原硬编码于 src/paper/shadow.py 的 10/20 阈值移入配置，改阈值无需改代码。
# =====================================================================
red_lines:
  cost_deviation_threshold: 10.0      # 成本模型累计偏差 (%) 警告线
  cost_deviation_critical: 20.0       # 成本模型累计偏差 (%) 严重线
  short_leg_threshold: 10.0           # 多空敞口失衡 (%) 警告线
  short_leg_critical: 20.0            # 多空敞口失衡 (%) 严重线
  # regime_switch 的阈值由 alpha_core.trend_gate 决定（不在此重复，避免双源不一致）

# =====================================================================
# 自动闭环 (autopilot) — 影子盘 → 风险闸门(kill-switch) → 周期回校/衰减监控/(可选)重挖
#
# 每日一次 `python cli.py autopilot` 即可：推进影子账本 → 评估风险闸门 → 持久化档位
# （下一轮 shadow 自动遵守）→ 按周期跑 §7 回校与因子衰减监控。**不含实盘下单**。
# 所有风险闸门阈值只做「收缩/走平」，永不放松既有因子/风控 gate。
# =====================================================================
autopilot:
  enabled: true
  state_file: "outputs/autopilot_state.json"
  report_md: "outputs/autopilot_report.md"
  # --- 风险闸门 (kill-switch)：按当前回撤/尾部收益/连亏天数收缩总敞口 ---
  risk_gate:
    min_history_days: 20              # 交易日数低于此不触发（防首周误杀）
    drawdown_de_risk: 0.10            # 当前回撤(距峰值) >= 10% -> 收缩至 de_risk_scale
    drawdown_halt: 0.15               # 当前回撤 >= 15% -> 走平
    trailing_window_days: 60          # 尾部收益窗口（交易日）
    trailing_return_de_risk: -0.10    # 60日收益 <= -10% -> 收缩
    trailing_return_halt: -0.15       # 60日收益 <= -15% -> 走平
    consecutive_loss_days_halt: 20    # 连续亏损 >= 20 日 -> 走平
    de_risk_scale: 0.5                # 收缩时的总敞口倍数
    recovery_hysteresis: 0.5          # 恢复比例：回撤/收益须回到触发阈值的 0.5 倍以内才解除（越大越易解除）
    cooldown_days: 5                  # 进入某档后的最小持续天数（防抖）
  # --- 周期任务 ---
  auto_calibrate: true                # 周期性 §7 回校并自动写回配置
  calibrate_interval_days: 20         # 每 ~20 个工作日回校一次（工作日近似，不含节假日）
  auto_monitor: true                  # 周期性因子衰减监控（写回 factor_decayed）
  remine_interval_days: 60            # 每 ~60 个工作日检查一次因子衰减（工作日近似）
  decay_window_days: 90               # ICIR 滚动窗口（对齐 research.decay.window_days）
  decay_icir_threshold: 0.30          # 衰减 ICIR 地板（对齐 factor_thresholds icir.keep）
  auto_remine: true                   # 衰减后事件驱动自动重挖（LLM 成本高；受 remine_cooldown_days 限流，且须过 min_sharpe 才 promote）
  remine_cooldown_days: 5             # 因子衰减持续期间，两次自动重挖的最小间隔（工作日；防每日重挖烧成本）
  min_sharpe: 1.0                     # 重挖后 promote 的 Sharpe 门限（等权复合，与 alpha_core 一致，不降低）
  # direction 3 (2026-08-26): which research window the auto-remine mines on.
  # Previously hardcoded to `train` (2010-2019) — but the decay that TRIGGERS the
  # remine is detected on the test window (2022-2025, via _monitor_decay). Mining
  # replacements on `train` re-derives the same stale low-vol/low-turnover family
  # in the old regime, not factors that work where the pool actually decayed.
  # Default `test` so replacements are mined on the regime where the decay lives.
  remine_window: "test"
  alerts_file: "outputs/autopilot_alerts.jsonl"  # 档位变化的机器可读告警日志（PAICC/cron 可监听）
  alert_webhook: ""                   # 可选：档位变化时 POST 该 URL（空则不发送）

# =====================================================================
# §7 三项回校 — PEAD 倾斜幅度 / 舆情阈值 / 交易成本模型
# =====================================================================
s7_calibration:
  enabled: true
  result_json: "outputs/s7_calibration.json"
  report_md: "outputs/s7_calibration.md"
  auto_apply: true                   # 自动写回 master_config.yaml
  window_start: "2020-01-01"         # PEAD 覆盖 2020-2025；舆情覆盖 2022-2025
  window_end: "2025-12-31"
  # 网格已向两侧扩边（2026-08-20 回校发现最优值落在旧网格边界，属边界过拟合，
  # 需更大范围确认真实最优而非「爬到网格边缘」）。
  amplitude_grid: [0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40]
  zscore_grid: [-1.0, -1.5, -2.0, -2.5, -3.0]
  freeze_grid: [3, 5, 7, 9, 11]
  cost_model:                        # 真实 A 股成本结构
    stamp_tax_sell_bps: 5.0          # 印花税 0.05% 仅卖出（2023-08 起）
    transfer_fee_bps: 0.1            # 过户费 0.001% 双边
    commission_bps: 2.5              # 券商佣金 ~0.025% 双边
    min_commission: 5.0              # 最低 5 元
    slippage_bps: 2.0                # 冲击成本估计（随量调整）
