# =====================================================================
# MASTER CONFIGURATION — single source of truth for the whole system.
# Editing this file re-tunes every IC gate, lookback and execution limit
# WITHOUT touching any source code.  (Blueprint §3)
# =====================================================================

project:
  name: "LLM_Quant_2026"
  start_date: "2010-01-01"      # full-A backfill starts here (was 2015-01-01)
  end_date: "2025-12-31"        # Prevent using data after 2025 for training

data:
  # Interpolated from .env PIT_DATABASE_URL (postgresql://pit:pit@localhost:5432/pit_data
  # in production; sqlite:///data/pit_data.db for local/offline runs).
  pit_database_url: "${PIT_DATABASE_URL}"
  news_api_key: ${NEWS_API_KEY}
  # Flip to true after a real ingestion is confirmed — gates the B1-B5 checks in `verify`.
  # Set true 2026-08-10 after the full A-share ingest (5,162 symbols, 12.48M bars).
  real_data: true
  # AlphaFeed primary / Baostock fallback (universe + fundamentals), AKShare for news.
  primary: "alphafeed"
  fallback: "baostock"
  rate_limits:                   # tokens/minute per endpoint (AlphaFeed paid → generous)
    alphafeed_daily: 300
    alphafeed_daily_batch: 120
    alphafeed_quote: 300
    alphafeed_adjust: 120
    baostock: 120
  alphafeed:
    api_key: "${ALPHAFEED_API_KEY}"   # interpolated from .env
    batch_size: 100              # symbols per klines.batch call (paid quota: safe)
  baostock:
    enabled: "${BAOSTOCK_ENABLED}"
  akshare:
    enabled: "${AKSHARE_ENABLED}"
  fundamentals:
    pilot_size: 50               # Q4: --fundamentals 只试点前 50 只
  checks:                        # B1-B5 thresholds
    # must be a trading day — a holiday anchor means no baostock snapshot and a
    # false "0 delisted" report (2015-01-01 is the New Year holiday; 01-05 is the first session)
    survivorship_date: "2015-01-05"
    max_staleness_days: 7
    min_coverage: 0.70           # A-share ~242/261 trading bdays ≈ 0.93, so 0.70 is generous
    adjustment_sample: 20        # price symbols sampled by the B3 check
    price_limit_band: 0.30       # max allowed |adjusted daily return| (BJ board ±30%)
  news:
    watchlist: ["600519.SH", "000001.SZ", "600036.SH", "601318.SH", "000858.SZ"]  # smoke-test set
  universe_dir: "data/universe"  # cached constituent lists (hs300/zz500/sse50) written by ingest

llm_routing:
  generator_model: "deepseek-v3"      # Cheap for schema generation
  code_model: "gpt-4o"               # Accurate for code
  critic_model: "claude-3.5-sonnet"  # For EvoQuant diagnosis
  max_tokens: 4096

factor_mining:
  ic_threshold: 0.02                 # Minimum to keep
  rank_ic_threshold: 0.035
  # LIMIT_DOWN blueprint 方案 D: medium/low-frequency only. A 5/10-day reversal's
  # lookback is what produced the crash-continuation bleed in Phase 8.1.
  min_lookback: 60                   # days
  max_lookback: 240
  default_lookback: 120
  allowed_lookbacks: [60, 120, 240]
  auto_upgrade_lookback: true        # bump any <60 lookback the LLM slips in
  # LIMIT_DOWN blueprint 方案 C: replay last-round rejection reasons into the
  # mining LLM so it stops proposing the factor family just proven unprofitable.
  enable_mining_feedback: true
  feedback_rounds: 3
  # validation_BLUEPRINT §3.1/§3.2: code-layer physical block (deepseek-v4-flash
  # ignores prompt feedback and re-proposes the banned reversal family, so the
  # code layer force-replaces it with a combination template) + per-iteration
  # sampling slots (free LLM slots + deterministic dual-factor combination
  # templates). 2+2 per iteration x 5 iterations = 20 factors, matching the
  # 6/20 (>=30%) validation gate.
  enable_code_layer_blocking: true
  free_generation_slots: 2
  template_slots: 2

# NOTE: `diversity.min_ast_distance` lives in factor_thresholds.yaml — the
# merge order (master -> thresholds -> llm_routing) means the later file wins,
# so editing it here is silently overridden. Set the diversity floor there.

risk_management:
  max_sharpe_drawdown: 0.15
  # 2026-08 REVERTED to the absolute drawdown gate. validation_BLUEPRINT §3.3's
  # excess-drawdown metric — max_drawdown_of(cum_strat/cum_bench - 1) — was
  # proven mathematically broken for a market-neutral long-short book (beta≈0):
  # it measures the absolute-height drop of the ratio level, so when the strategy
  # compounds ahead of a volatile index, even a PURE CASH position scores
  # excess_dd ≈ 1.03 (vs the 0.25 limit) because the benchmark's own swings
  # (HS300 2013 trough -41%, 2015 peak +51%) dominate. 0/20 rejected under it,
  # yet the same factors pass the absolute 15% gate with abs_dd 0.105-0.109.
  # `benchmark` and `max_excess_drawdown` are removed so the eval gate and risk
  # gate fall back to sharpe.max_drawdown_limit / max_drawdown_in_crisis.
  market_state_bins: ["bull", "bear", "sideways"]
  # LIMIT_DOWN blueprint: a factor must not be a crash artefact — its portfolio
  # drawdown inside each crisis window (on the limit-lock-tradeable series) must
  # stay under max_drawdown_in_crisis (main gate stays 0.15).
  crisis_test:
    enabled: true
    periods:
      - name: "2015股灾"
        start: "2015-05-01"
        end: "2015-09-30"
      - name: "2018熊市"
        start: "2018-01-01"
        end: "2018-12-31"
      - name: "2024微盘股"
        start: "2024-01-01"
        end: "2024-02-29"
    max_drawdown_in_crisis: 0.20

# LIMIT_DOWN blueprint 方案 B: the backtest's portfolio Sharpe / max-drawdown
# run on forward returns with price-limit-locked bars masked (a -10% continuation
# you cannot actually transact), while IC/rank_ic stay on the raw series.
evaluation:
  ic_use_raw_returns: true
  portfolio:
    exclude_limit_locked: true
    limit_threshold: 0.095           # 主板 10% limit band
    dynamic_threshold: true          # 创业/科创 20% (2020-08-24+), 北交所 30%

online_execution:
  latency_target_ms: 10              # Must execute fast
  max_position_pct: 0.05

# Walk-forward research windows (requirements.md C1-C2). The research loops
# (mine/backtest/monitor) run on `research.universe`; the underlying data stays full-A.
research:
  train_start: "2010-01-01"
  train_end: "2019-12-31"
  val_start: "2020-01-01"
  val_end: "2021-12-31"
  test_start: "2022-01-01"
  test_end: "2025-12-31"
  universe: "hs300_500"          # "all" | a symbol list | a cached name under data.universe_dir
  mining:
    iterations: 50               # C1: increased from default 3
    walks: 20                    # C1: more walk-forward rounds
    bonferroni_correction: true  # C1: multiple testing correction
  decay:
    window_days: 90
    icir_threshold: 0.30         # aligns with factor_thresholds.yaml icir.keep_threshold
