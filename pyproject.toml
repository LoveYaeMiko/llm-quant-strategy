[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-quant-strategy"
version = "0.1.0"
description = "LLM-driven quantitative trading system — offline R&D (LLM-heavy) strictly separated from online execution (deterministic)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "FQA" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
llm = [
    "openai>=1.0",
    "langgraph>=0.1",
]
dl = [
    "torch>=2.0",
    "transformers>=4.30",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]
data = [
    "alphafeed>=0.1",
    "baostock>=0.8.8",
    "akshare>=1.16",
    "psycopg2-binary>=2.9",
]

[project.scripts]
llm-quant = "src.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:nonebug -p no:asyncio"
